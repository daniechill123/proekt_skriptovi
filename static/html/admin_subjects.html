<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Админ - Предмети</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        body { background-color: #f9f9f9; background-image: none; margin: 0; font-family: sans-serif; }
        .admin-header { text-align: center; font-size: 2.5rem; margin-top: 2rem; }
        .admin-nav { display: flex; justify-content: center; gap: 20px; margin: 2rem 0; }
        .admin-nav-btn { padding: 10px 20px; font-size: 1.2rem; cursor: pointer; border: 2px solid #000; background: #fff; }
        .admin-nav-btn.active { font-weight: bold; }
        .controls-container { display: flex; justify-content: flex-end; width: 90%; margin: 0 auto 10px auto; }
        .add-btn { padding: 10px; font-size: 1rem; border: 2px solid #000; background: #fff; cursor: pointer; }
        .data-table { width: 90%; margin: 0 auto; border-collapse: collapse; text-align: center; background: #fff; border: 2px solid #000; }
        .data-table th, .data-table td { border: 2px solid #000; padding: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 2rem; border-radius: 5px; width: 300px; display: flex; flex-direction: column; gap: 15px; }
    </style>
</head>
<body>

    <h1 class="admin-header">ADMIN</h1>

    <nav class="admin-nav">
        <button class="admin-nav-btn" onclick="window.location.href='/admin/users'">Потребители</button>
        <button class="admin-nav-btn" onclick="window.location.href='/admin/classes'">Класове</button>
        <button class="admin-nav-btn active" onclick="window.location.href='/admin/subjects'">Предмети</button>
    </nav>

    <div class="controls-container">
        <button class="add-btn" id="open-add-modal-btn">+ Добавяне на нов предмет</button>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Предмет</th>
                <th>Преподавател</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="subjects-table-body">
            </tbody>
    </table>

    <div class="modal" id="add-modal">
        <form class="modal-content" id="add-subject-form">
            <h2>Добави предмет</h2>
            <label>Име на предмет:</label>
            <input type="text" id="add-subject-name" required>
            <label>Преподавател:</label>
            <select id="add-subject-teacher">
                <option value="">Без преподавател</option>
            </select>
            <div style="display:flex; gap:10px;">
                <button type="button" id="close-add-modal-btn">Отказ</button>
                <button type="submit" style="background:#4CAF50; color:white;">Запази</button>
            </div>
        </form>
    </div>

    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2>Редактирай предмет</h2>
            <input type="hidden" id="edit-subject-id">
            <label>Име на предмет:</label>
            <input type="text" id="edit-subject-name">
            <label>Преподавател:</label>
            <select id="edit-subject-teacher">
                <option value="">Без преподавател</option>
            </select>
            <div style="display:flex; gap:10px;">
                <button id="close-edit-modal-btn">Отказ</button>
                <button id="save-edit-btn" style="background:#4CAF50; color:white;">Запази промените</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin_subjects.js"></script>
</body>
</html>
