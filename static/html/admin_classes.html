<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панел - Класове</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body.admin-page-body {
            background-color: #f9f9f9 !important;
            background-image: none !important;
            margin: 0 !important;
            padding: 0 !important;
            height: auto !important;
            min-height: 100vh !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: stretch !important;
            font-family: sans-serif !important;
        }
        .admin-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
            padding-bottom: 100px;
        }
        .admin-header {
            text-align: center !important;
            margin-top: 2rem !important;
            margin-bottom: 0 !important;
        }
        .admin-header h1 {
            margin: 0 !important;
            font-size: 2.5rem !important;
        }
    </style>
</head>
<body class="admin-page-body">
    <div class="admin-layout">
        <header class="admin-header">
            <h1>ADMIN</h1>
        </header>

        <nav class="admin-nav">
            <button class="admin-nav-btn" onclick="window.location.href='/admin/users'">Потребители</button>
            <button class="admin-nav-btn active" onclick="window.location.href='/admin/classes'">Класове</button>
            <button class="admin-nav-btn" onclick="window.location.href='/admin/subjects'">Предмети</button>
        </nav>

        <div class="admin-toolbar">
            <div class="search-group">
                <label for="search-input">Търсене по номер</label>
                <select id="search-input" style="padding:0.4rem; border-radius:0.25rem; font-size:1rem; border:1px solid #ccc;">
                    <option value="">Всички</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </div>
            <div class="add-action-group">
                <button id="open-add-modal-btn" class="btn-add-profile">+ Добавяне на нов клас</button>
            </div>
        </div>

        <main class="admin-main-content">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Клас</th>
                        <th>Паралелка</th>
                        <th>Брой ученици</th>
                        <th>Редактиране/ изтриване</th>
                    </tr>
                </thead>
                <tbody id="classes-table-body">
                </tbody>
            </table>
        </main>
    </div>

    <div id="edit-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:2rem; border-radius:0.5rem; width:25rem; max-width:90%; box-shadow: 0 0.25rem 0.95rem rgba(0,0,0,0.3); font-family: sans-serif;">
            <h3 style="margin-top:0; margin-bottom:1.25rem; color:#333; font-size:1.5rem;">Редактиране на клас</h3>
            
            <input type="hidden" id="edit-class-id">
            
            <label style="display:block; margin-bottom:0.3rem; font-weight:bold; font-size:1rem;">Клас (число):</label>
            <input type="number" id="edit-class-grade" min="1" max="12" required style="width:100%; padding:0.5rem; margin-bottom:1rem; border:0.06rem solid #ccc; border-radius:0.25rem; box-sizing:border-box; font-size:1rem;">
            
            <label style="display:block; margin-bottom:0.3rem; font-weight:bold; font-size:1rem;">Паралелка (буква):</label>
            <input type="text" id="edit-class-section" required style="width:100%; padding:0.5rem; margin-bottom:1.25rem; border:0.06rem solid #ccc; border-radius:0.25rem; box-sizing:border-box; font-size:1rem;">
            
            <div style="text-align:right;">
                <button id="close-modal-btn" style="background:#ccc; border:none; padding:0.6rem 1rem; border-radius:0.25rem; cursor:pointer; margin-right:0.6rem; font-size:1rem;">Отказ</button>
                <button id="save-modal-btn" style="background:#28a745; color:white; border:none; padding:0.6rem 1.25rem; border-radius:0.25rem; cursor:pointer; font-size:1rem;">Запази промените</button>
            </div>
        </div>
    </div>

    <div id="add-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:2rem; border-radius:0.5rem; width:25rem; max-width:90%; box-shadow: 0 0.25rem 0.95rem rgba(0,0,0,0.3); font-family: sans-serif;">
            <h3 style="margin-top:0; margin-bottom:1.25rem; color:#333; font-size:1.5rem;">Добавяне на нов клас</h3>
            <form id="add-class-form">
                <label style="display:block; margin-bottom:0.3rem; font-weight:bold; font-size:1rem;">Клас (число):</label>
                <input type="number" id="add-class-grade" min="1" max="12" required style="width:100%; padding:0.5rem; margin-bottom:1rem; border:0.06rem solid #ccc; border-radius:0.25rem; box-sizing:border-box; font-size:1rem;">
                
                <label style="display:block; margin-bottom:0.3rem; font-weight:bold; font-size:1rem;">Паралелка (буква):</label>
                <input type="text" id="add-class-section" required style="width:100%; padding:0.5rem; margin-bottom:1.25rem; border:0.06rem solid #ccc; border-radius:0.25rem; box-sizing:border-box; font-size:1rem;">
                
                <div style="text-align:right;">
                    <button type="button" id="close-add-modal-btn" style="background:#ccc; border:none; padding:0.6rem 1rem; border-radius:0.25rem; cursor:pointer; margin-right:0.6rem; font-size:1rem;">Отказ</button>
                    <button type="submit" style="background:#28a745; color:white; border:none; padding:0.6rem 1.25rem; border-radius:0.25rem; cursor:pointer; font-size:1rem;">Добави</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer-bar">
        <div class="footer-left">
            <div class="footer-icon-box">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5.49 12l6.51 3.55 6.51-3.55L12 8.45 5.49 12zm-3.37 3.3l1.86 1.01L12 20.67l7.98-4.35 1.86-1.01V17l-9.84 5.37L2.12 17v-1.7z"></path>
                </svg>
            </div>
        </div>
        <div class="footer-center">
            <h2>Дневник</h2>
        </div>
        <div class="footer-right">
            <img src="/static/images/logo_footer.png?v=1" alt="Лого" class="footer-logo">
        </div>
    </div>

    <script src="/static/js/admin_classes.js"></script>
</body>
</html>
