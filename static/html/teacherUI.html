<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник - Учителски панел</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="diary-page-body">
    <div class="diary-layout">
        
        <aside class="sidebar">
            <div class="class-list-container" id="class-sidebar-list">
            </div>
            
            <div class="sidebar-footer">
                <div class="footer-logo-wrapper">
                    <img src="/static/images/LOGO.png" alt="Лого" class="footer-logo">
                </div>
                <h2 class="footer-title">Дневник</h2>
                <button id="logout-btn" style="margin-top: 15px; padding: 5px 15px; cursor: pointer;">Изход</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-class-header">
                <h1 id="current-class-title" style="text-align: center;">Изберете клас</h1>
            </header>
            
            <div class="table-container">
                <table border="1" style="width:100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th rowspan="2">Ученик</th>
                            <th colspan="2">Първи срок</th>
                            <th colspan="2">Втори срок</th>
                        </tr>
                        <tr>
                            <th>Текущи оценки</th>
                            <th>Нова оценка</th>
                            <th>Текущи оценки</th>
                            <th>Нова оценка</th>
                        </tr>
                    </thead>
                    <tbody id="teacher-table-body">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/static/js/teacherUI.js"></script>
</body>
</html>
